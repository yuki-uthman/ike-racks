  .eyebrow { font-size: 13px; font-weight: 600; color: var(--ink2); letter-spacing: 0.01em; padding: 4px 2px 0; }
  .eyebrow b { color: var(--ink); font-weight: 700; }

  .unit { font-size: 18px; font-weight: 700; color: var(--ink2); letter-spacing: 0; }

  .pill b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .charthead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 16px 18px 0; }

  .hint { font-size: 12.5px; color: var(--ink3); }
  .chart { display: flex; gap: 10px; height: 190px; padding: 6px 14px 14px 12px; }
  .axis { position: relative; flex: 0 0 30px; margin-top: 22px; margin-bottom: 26px; }
  .axis span { position: absolute; right: 0; transform: translateY(-50%); font-size: 10.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .plotwrap { position: relative; flex: 1; min-width: 0; }
  .grid { position: absolute; left: 0; right: 0; top: 22px; bottom: 26px; pointer-events: none; }
  .grid i { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); }
  .bars { position: relative; display: flex; gap: 6px; height: 100%; }
  .bar { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .barcol { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-top: 22px; }
  .val { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 4px; font-variant-numeric: tabular-nums; line-height: 1; height: 12px; }
  .val.zero { color: transparent; }
  .fill { width: 70%; max-width: 34px; min-height: 2px; border-radius: 5px 5px 2px 2px; background: var(--accent); transition: height 300ms cubic-bezier(0.2,0.8,0.2,1), opacity 0.2s; }
  .fill.zero { background: var(--grid); height: 2px !important; }
  .lbl { height: 26px; display: flex; align-items: center; font-size: 11px; color: var(--ink3); white-space: nowrap; }
  .bars.has-sel .bar:not(.sel) .fill { opacity: 0.35; }
  .bar.sel .lbl { color: var(--ink); font-weight: 700; }
  .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .listhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 6px; }
  .chip { display: none; align-items: center; gap: 6px; border: 0; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 5px 11px; }

  .rows { list-style: none; margin: 0; padding: 0 0 8px; }
  .row { padding: 12px 18px; }

  .name { font-size: 14.5px; font-weight: 600; line-height: 1.25; }

  .vbars { margin-bottom: 14px; }
  .months { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; }
  .m { text-align: center; border-radius: 6px; padding: 3px 0 4px; background: var(--muted); }
  .m small { display: block; font-size: 9.5px; color: var(--ink3); letter-spacing: 0.02em; }
  .m span { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .t td.z { color: var(--ink3); }
  .t td.tot, .t th.tot { font-weight: 800; color: var(--ink); padding-right: 18px; }
  .t tr.g td { background: var(--muted); font-family: Manrope, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink2); }
  .t tr.g td:first-child { background: var(--muted); }
  .foot { text-align: center; font-size: 12px; color: var(--ink3); padding: 2px 8px; line-height: 1.55; }
  @media (max-width: 380px) { .total { font-size: 54px; } .m small { font-size: 8.5px; } .m span { font-size: 12px; } }
  @media (prefers-reduced-motion: reduce) { .fill, .meter i { transition: none; } }
</style>
